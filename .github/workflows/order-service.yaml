name: Order Service CI

on:
  push:
    branches: [main]
    paths: &order_ci_paths
      - 'order-service/**'
      - 'shared/grpc/**'
      - 'shared/grpc/package.json'
      - 'shared/messaging/package.json'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - 'credit-service/package.json'
      - 'supplier-service/package.json'
      - 'user-service/package.json'
      - 'user-service/proto/**'
      - '.github/workflows/order-service.yaml'
  pull_request:
    paths: *order_ci_paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # Nested under the repo name so GITHUB_TOKEN can publish (GHCR lowercases this).
  IMAGE_NAME: ${{ github.repository }}/order-service

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: order_service
          POSTGRES_PASSWORD: order_service
          POSTGRES_DB: order_service_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U order_service -d order_service_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://order_service:order_service@127.0.0.1:5432/order_service_test
      TEST_DATABASE_URL: postgresql://order_service:order_service@127.0.0.1:5432/order_service_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build -w @foc/grpc -w @foc/order-grpc
      - run: npm test -w @foc/order-grpc
      - run: npm run prisma:deploy -w @foc/order-grpc
      - run: npm run test:integration -w @foc/order-grpc

  build-and-push-image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm SHA is still the branch tip
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          if ! current=$(gh api "repos/${{ github.repository }}/commits/${{ github.ref_name }}" --jq .sha); then
            echo "Could not verify branch tip; skipping mutable latest tag"
            echo "stale=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$current" != "${{ github.sha }}" ]; then
            echo "SHA ${{ github.sha }} is no longer the tip of ${{ github.ref_name }} ($current)"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ steps.tip.outputs.stale != 'true' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: order-service/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Migration image, used by the Kubernetes initContainer before the app starts.
      - name: Extract Docker metadata (migrate)
        id: meta-migrate
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-migrate
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ steps.tip.outputs.stale != 'true' }}

      - name: Build and push migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: order-service/Dockerfile
          target: migrate
          push: true
          tags: ${{ steps.meta-migrate.outputs.tags }}
          labels: ${{ steps.meta-migrate.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
