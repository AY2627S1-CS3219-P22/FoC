name: Supplier Service CI

on:
  push:
    branches: [main]
    paths: &supplier_ci_paths
      - 'supplier-service/**'
      - 'shared/grpc/**'
      - 'shared/messaging/**'
      - 'shared/grpc/package.json'
      - 'shared/messaging/package.json'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - 'order-service/grpc/package.json'
      - 'credit-service/package.json'
      - 'user-service/package.json'
      - 'user-service/proto/**'
      - '.github/workflows/supplier-service.yaml'
  pull_request:
    paths: *supplier_ci_paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # Nested under the repo name so GITHUB_TOKEN can publish (GHCR lowercases this).
  IMAGE_NAME: ${{ github.repository }}/supplier-service

jobs:
  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint -w supplier-service

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build --workspace @foc/grpc
      - run: npm test -w supplier-service

  build-and-push-image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm SHA is still the branch tip
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          if ! current=$(gh api "repos/${{ github.repository }}/commits/${{ github.ref_name }}" --jq .sha); then
            echo "Could not verify branch tip; skipping mutable latest tag"
            echo "stale=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$current" != "${{ github.sha }}" ]; then
            echo "SHA ${{ github.sha }} is no longer the tip of ${{ github.ref_name }} ($current)"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ steps.tip.outputs.stale != 'true' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: supplier-service/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
