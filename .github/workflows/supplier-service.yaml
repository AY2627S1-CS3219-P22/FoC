# Grok 4.7, 2026-11-09: deploy job and k8s path trigger; review pending; see ai/usage-log.md, entry 003.

name: Supplier Service CI

on:
  push:
    branches: [main]
    paths: &supplier_ci_paths
      - 'supplier-service/**'
      - 'shared/grpc/**'
      - 'shared/messaging/**'
      - 'shared/grpc/package.json'
      - 'shared/messaging/package.json'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - 'order-service/grpc/package.json'
      - 'credit-service/package.json'
      - 'user-service/package.json'
      - 'user-service/proto/**'
      - '.github/workflows/supplier-service.yaml'
      - 'k8s/supplier-service/**'
  pull_request:
    paths: *supplier_ci_paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # Nested under the repo name so GITHUB_TOKEN can publish (GHCR lowercases this).
  IMAGE_NAME: ${{ github.repository }}/supplier-service

jobs:
  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint -w supplier-service

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build --workspace @foc/grpc
      - run: npm test -w supplier-service

  build-and-push-image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm SHA is still the branch tip
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          if ! current=$(gh api "repos/${{ github.repository }}/commits/${{ github.ref_name }}" --jq .sha); then
            echo "Could not verify branch tip; skipping mutable latest tag"
            echo "stale=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$current" != "${{ github.sha }}" ]; then
            echo "SHA ${{ github.sha }} is no longer the tip of ${{ github.ref_name }} ($current)"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ steps.tip.outputs.stale != 'true' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: supplier-service/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # CD only: runs after the image for this commit is pushed on main.
  deploy:
    needs: build-and-push-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Deploy to EKS
        env:
          CLUSTER: ${{ vars.EKS_CLUSTER_NAME }}
        run: |
          set -euo pipefail
          if [ -z "$CLUSTER" ]; then
            echo "Set the EKS_CLUSTER_NAME repository variable."
            exit 1
          fi
          aws eks update-kubeconfig --name "$CLUSTER" --region ap-southeast-1
          kubectl apply -f k8s/shared/namespace.yaml
          tag="sha-${GITHUB_SHA}"
          {
            sed -E "s#(image: .*/supplier-service:)[^[:space:]]+#\\1${tag}#g" k8s/supplier-service/supplier-service.yaml
            echo "---"
            cat k8s/supplier-service/supplier-config.yaml
          } | kubectl apply -f -
          kubectl -n foc rollout status deployment/supplier-service --timeout=5m

