services:
  migrate:
    image: foc-credit:local
    build:
      context: ..
      dockerfile: credit-service/Dockerfile
    profiles: [app]
    command: ["node", "../db/migrate.cjs"]
    environment:
      DATABASE_URL: postgresql://credit:credit@db:5432/credit
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"
  app:
    image: foc-credit:local
    build:
      context: ..
      dockerfile: credit-service/Dockerfile
    profiles: [app]
    init: true
    environment:
      NODE_ENV: production
      GRPC_HOST: 0.0.0.0
      GRPC_PORT: "50053"
      DATABASE_URL: postgresql://credit:credit@db:5432/credit
      USER_GRPC_ADDR: user-service:50052
      ORDER_GRPC_ADDR: order-service:50051
      CREDIT_GRPC_ADDR: app:50053
      SUPPLIER_GRPC_ADDR: supplier-service:50054
    ports:
      - "127.0.0.1:50053:50053"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: credit
      POSTGRES_PASSWORD: credit
      POSTGRES_DB: credit
    ports:
      - "127.0.0.1:54333:5432"
    volumes:
      - credit-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credit -d credit"]
      interval: 2s
      timeout: 3s
      retries: 20
  test-db:
    image: postgres:17-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: credit
      POSTGRES_PASSWORD: credit
      POSTGRES_DB: credit_test
    ports:
      - "127.0.0.1:54334:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credit -d credit_test"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  credit-data:
