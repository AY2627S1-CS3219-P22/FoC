$kind: grpc-request
description: "Registration grants 10 starter credits."
url: "{{credit_url}}"
methodPath: credit.CreditService.InitCredits
methodDescriptor: 
message:
  content: |-
    {"user_id": "{{requester_id}}"}
metadata:
  - key: x-credit-service-token
    value: "{{user_token}}"
settings: {}
auth:
  type: noauth
scripts:
  - type: beforeInvoke
    code: |-
      // Fresh IDs for every run of the flow.
      for (const name of ['requester_id', 'courier_id', 'order_id', 'cancel_order_id']) {
        pm.collectionVariables.set(name, pm.variables.replaceIn('{{$guid}}'));
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      const data = (pm.response.messages.idx(0) || {}).data || {};
      // Postman may show snake_case or camelCase names, and proto3 can omit zero values.
      const field = (snake, camel) => data[snake] ?? data[camel] ?? 0;
      pm.test('call succeeded', () => pm.expect(Number(pm.response.statusCode)).to.equal(0));
      pm.test('total is 10', () => pm.expect(field('total_credits', 'totalCredits')).to.equal(10));
      pm.test('reserved is 0', () => pm.expect(field('reserved_credits', 'reservedCredits')).to.equal(0));
      pm.test('available is 10', () => pm.expect(field('available_credits', 'availableCredits')).to.equal(10));
    language: text/javascript
schema:
  source: specification
  specificationId: ../../shared/grpc/proto/credit.proto
order: 1000
