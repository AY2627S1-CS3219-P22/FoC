$kind: grpc-request
description: "Order Service holds the reward when the errand is created."
url: "{{credit_url}}"
methodPath: credit.CreditService.ReserveCredits
methodDescriptor: 
message:
  content: |-
    {"order_id": "{{order_id}}", "requester_id": "{{requester_id}}", "amount": 4}
metadata:
  - key: x-credit-service-token
    value: "{{order_token}}"
settings: {}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const data = (pm.response.messages.idx(0) || {}).data || {};
      // Postman may show snake_case or camelCase names, and proto3 can omit zero values.
      const field = (snake, camel) => data[snake] ?? data[camel] ?? 0;
      pm.test('call succeeded', () => pm.expect(Number(pm.response.statusCode)).to.equal(0));
      pm.test('status is RESERVED', () => pm.expect(String(field('status', 'status'))).to.equal('RESERVED'));
      pm.test('4 credits held', () => pm.expect(field('amount', 'amount')).to.equal(4));
      pm.test('version 1', () => pm.expect(field('version', 'version')).to.equal(1));
    language: text/javascript
schema:
  source: specification
  specificationId: ../../shared/grpc/proto/credit.proto
order: 5000
