$kind: grpc-request
description: "Only 6 credits are available."
url: "{{credit_url}}"
methodPath: credit.CreditService.ReserveCredits
methodDescriptor: 
message:
  content: |-
    {"order_id": "{{$guid}}", "requester_id": "{{requester_id}}", "amount": 7}
metadata:
  - key: x-credit-service-token
    value: "{{order_token}}"
settings: {}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('rejected with FAILED_PRECONDITION (9)', () => pm.expect(Number(pm.response.statusCode)).to.equal(9));
    language: text/javascript
schema:
  source: specification
  specificationId: ../../shared/grpc/proto/credit.proto
order: 7000
