$kind: grpc-request
description: "Transfers the held reward to the courier."
url: "{{credit_url}}"
methodPath: credit.CreditService.SettleCredits
methodDescriptor: 
message:
  content: |-
    {"order_id": "{{order_id}}", "courier_id": "{{courier_id}}"}
metadata:
  - key: x-credit-service-token
    value: "{{order_token}}"
settings: {}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const data = (pm.response.messages.idx(0) || {}).data || {};
      // Postman may show snake_case or camelCase names, and proto3 can omit zero values.
      const field = (snake, camel) => data[snake] ?? data[camel] ?? 0;
      pm.test('call succeeded', () => pm.expect(Number(pm.response.statusCode)).to.equal(0));
      pm.test('status is SETTLED', () => pm.expect(String(field('status', 'status'))).to.equal('SETTLED'));
      pm.collectionVariables.set('settled_version', field('version', 'version'));
    language: text/javascript
schema:
  source: specification
  specificationId: ../../shared/grpc/proto/credit.proto
order: 11000
