$kind: grpc-request
description: "Cancellation or expiry releases the hold."
url: "{{credit_url}}"
methodPath: credit.CreditService.ReleaseCredits
methodDescriptor: 
message:
  content: |-
    {"order_id": "{{cancel_order_id}}"}
metadata:
  - key: x-credit-service-token
    value: "{{order_token}}"
settings: {}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const data = (pm.response.messages.idx(0) || {}).data || {};
      // Postman may show snake_case or camelCase names, and proto3 can omit zero values.
      const field = (snake, camel) => data[snake] ?? data[camel] ?? 0;
      pm.test('call succeeded', () => pm.expect(Number(pm.response.statusCode)).to.equal(0));
      pm.test('status is RELEASED', () => pm.expect(String(field('status', 'status'))).to.equal('RELEASED'));
    language: text/javascript
