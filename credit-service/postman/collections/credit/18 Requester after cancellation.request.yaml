$kind: grpc-request
description: "Held credits are available again; total never changed."
url: "{{credit_url}}"
methodPath: credit.CreditService.GetBalance
methodDescriptor: 
message:
  content: |-
    {"user_id": "{{requester_id}}"}
metadata:
  - key: x-credit-service-token
    value: "{{order_token}}"
settings: {}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const data = (pm.response.messages.idx(0) || {}).data || {};
      // Postman may show snake_case or camelCase names, and proto3 can omit zero values.
      const field = (snake, camel) => data[snake] ?? data[camel] ?? 0;
      pm.test('call succeeded', () => pm.expect(Number(pm.response.statusCode)).to.equal(0));
      pm.test('total is 4', () => pm.expect(field('total_credits', 'totalCredits')).to.equal(4));
      pm.test('reserved is 0', () => pm.expect(field('reserved_credits', 'reservedCredits')).to.equal(0));
      pm.test('available is 4', () => pm.expect(field('available_credits', 'availableCredits')).to.equal(4));
    language: text/javascript
schema:
  source: specification
  specificationId: ../../shared/grpc/proto/credit.proto
order: 18000
