# AI Assistance Disclosure: Claude Code (Claude Opus 5.5), 2026-11-12.
# Scope: chat-service Deployment + Service, copied from supplier-service.yaml with one replica, port 3005 and no gRPC. Replicas comment now explains how to enable scaling.
# Details: ai/usage-log.md, entry 007, 008.
# the service in this file sends HTTP and Socket.IO traffic from nginx (/backend/chat) to the chat pod, port 3005
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  namespace: foc
  labels: { app.kubernetes.io/name: chat-service, app.kubernetes.io/part-of: foc }
spec:
  # One pod for now: Socket.IO keeps each errand's chat room in the pod's
  # memory, so users on a second pod would not get each other's messages.
  # chat-redis.yaml and chat-hpa.yaml are ready for scaling. Once chat-service
  # uses the Redis adapter and the UI connects with WebSocket only, delete this
  # line and enable chat-hpa.yaml in kustomization.yaml (the HPA then owns the
  # pod count; leaving this line in would reset it to 1 on every deploy).
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: chat-service }
  template:
    metadata:
      labels: { app.kubernetes.io/name: chat-service, app.kubernetes.io/part-of: foc }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000                  # the image's "node" user
      terminationGracePeriodSeconds: 30
      containers:
        - name: chat-service
          image: ghcr.io/ay2627s1-cs3219-p22/foc/chat-service:latest
          imagePullPolicy: Always   # latest moves on every build, so always check GHCR
          ports:
            - { name: http, containerPort: 3005 }
          envFrom:  # loads settings and secrets from the other yaml files
            - configMapRef: { name: chat-config }
            - secretRef: { name: chat-secrets }
          volumeMounts:
            - name: user-public-key       # verifies users' login tokens
              mountPath: /app/keys/public.pem
              subPath: public.pem
              readOnly: true
          readinessProbe:  # calls /health every 10s and stops sending traffic to the pod if it keeps failing, for eg if database is down
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe: # calls /health every 20s and restarts the container if it keeps failing
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          lifecycle:
            preStop:  # waits 5s before shutdown so traffic can move away, allows 30s in total
              sleep: { seconds: 5 }       # let traffic drain before SIGTERM
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:  # chat only logs to stdout, so no writable log mount is needed
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      volumes:
        - name: user-public-key
          configMap: { name: user-public-key }
---  # how nginx reaches the app
apiVersion: v1
kind: Service
metadata:
  name: chat-service
  namespace: foc
  labels: { app.kubernetes.io/name: chat-service, app.kubernetes.io/part-of: foc }
spec:
  clusterIP: None # headless, same as the other services; nginx re-resolves it every 10s
  selector: { app.kubernetes.io/name: chat-service }
  ports:
    - { name: http, port: 3005, targetPort: http }
