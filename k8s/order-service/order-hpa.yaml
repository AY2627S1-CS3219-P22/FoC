apiVersion: autoscaling/v2   
kind: HorizontalPodAutoscaler  
metadata:
  name: order-service
  namespace: foc
  labels: { app.kubernetes.io/name: order-service, app.kubernetes.io/part-of: foc }
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: order-service
  minReplicas: 2 # to fit with our 99% availability and zero-downtime deployment NFRs
  maxReplicas: 6 # to meet N1.1, but should settle real number with load test
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 } 
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120   # don't drop pods the moment a spike ends
