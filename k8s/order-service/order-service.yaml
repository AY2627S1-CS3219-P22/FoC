# AI Assistance Disclosure: Claude Code (Claude Opus), 2026-11-06.
# Scope: migrate initContainer memory limit (OOMKilled at 128Mi).
# Details: ai/usage-log.md, entry 003.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: foc
  labels: { app.kubernetes.io/name: order-service, app.kubernetes.io/part-of: foc }
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: order-service }
  template:
    metadata:
      labels: { app.kubernetes.io/name: order-service, app.kubernetes.io/part-of: foc }
    spec:
      # nodeSelector: { role: order }   # enable on EC2; leave off for local k3d
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000                  # the image's "node" user
      terminationGracePeriodSeconds: 30
      initContainers:   # applies any new database migrations, only relevant for order
        - name: migrate
          image: ghcr.io/ay2627s1-cs3219-p22/foc/order-service-migrate:latest
          imagePullPolicy: Always   # latest moves on every build, so always check GHCR
          command: ['npm', 'run', 'prisma:deploy']
          envFrom:
            - secretRef: { name: order-secrets }
          resources:   # prisma's migrate engine was OOMKilled at 128Mi
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 512Mi }
      containers:
        - name: order-service
          image: ghcr.io/ay2627s1-cs3219-p22/foc/order-service:latest
          imagePullPolicy: Always   # latest moves on every build, so always check GHCR
          ports:
            - { name: grpc, containerPort: 50053 }
            - { name: http, containerPort: 3003 }
          envFrom:  # loads settings and secrets from the other yaml files
            - configMapRef: { name: order-config }
            - secretRef: { name: order-secrets }
          volumeMounts:
            - name: user-public-key
              mountPath: /run/keys/user-public.pem
              subPath: public.pem
              readOnly: true
          readinessProbe:  # calls /health every 10s and stops sending traffic to the pod if it keeps failing, for eg if database is down
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe: # checks that grpc port accepts connections and restarts container if it keeps failing
            tcpSocket: { port: grpc }
            initialDelaySeconds: 15
            periodSeconds: 20
          lifecycle:
            preStop:  # waits 5s before shutdown so traffic can move away, allows 30s in total
              sleep: { seconds: 5 }       # let traffic drain before SIGTERM
          resources:
            requests: { cpu: 250m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext: 
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      volumes:
        - name: user-public-key
          configMap: { name: user-public-key }
---  # how other pods reach the app
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: foc
  labels: { app.kubernetes.io/name: order-service, app.kubernetes.io/part-of: foc }
spec:
  clusterIP: None # headless: DNS returns every pod IP so gRPC clients can balance across pods
  selector: { app.kubernetes.io/name: order-service }
  ports:
    - { name: grpc, port: 50053, targetPort: grpc, appProtocol: grpc }
    - { name: http, port: 3003, targetPort: http }
