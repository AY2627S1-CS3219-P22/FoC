# Shared RabbitMQ broker for all services.
# Credentials come from the rabbitmq-secrets Secret (created by command, see k8s/README.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: foc
  labels: { app.kubernetes.io/name: rabbitmq, app.kubernetes.io/part-of: foc }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: rabbitmq }
  template:
    metadata:
      labels: { app.kubernetes.io/name: rabbitmq, app.kubernetes.io/part-of: foc }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          ports:
            - { name: amqp, containerPort: 5672 }
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom: { secretKeyRef: { name: rabbitmq-secrets, key: RABBITMQ_DEFAULT_USER } }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: { secretKeyRef: { name: rabbitmq-secrets, key: RABBITMQ_DEFAULT_PASS } }
          readinessProbe:   # same as compose's healthcheck
            exec: { command: ['rabbitmq-diagnostics', '-q', 'ping'] }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
---
# Stable name other services connect to: amqp://USER:PASS@rabbitmq:5672
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: foc
  labels: { app.kubernetes.io/name: rabbitmq, app.kubernetes.io/part-of: foc }
spec:
  selector: { app.kubernetes.io/name: rabbitmq }
  ports:
    - { name: amqp, port: 5672, targetPort: amqp }
