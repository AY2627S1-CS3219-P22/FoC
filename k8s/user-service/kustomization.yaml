# Lists the user app manifests for `kubectl apply -k`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - user-db.yaml
  - user-redis.yaml
  - user-config.yaml
  - user-service.yaml
images:
