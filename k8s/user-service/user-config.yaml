# used to manage non sensitive configuration data so they aren't hardcoded in image
# after applying a change, run kubectl rollout restart deployment/user-service -n foc
apiVersion: v1
kind: ConfigMap
metadata:
  name: user-config
  namespace: foc
  labels: { app.kubernetes.io/name: user-service, app.kubernetes.io/part-of: foc }
data: # ports here need to match containerPort and probes in *-service.yaml file
  PORT: "3001"
  PGDATABASE: user_service
  JWT_PUBLIC_KEY_PATH: /app/keys/public.pem
  JWT_PRIVATE_KEY_PATH: /app/keys/private.pem
  # the public link is plain http (no domain for an HTTPS certificate), and browsers
  # drop Secure cookies over http; set back to "true" once the site has HTTPS
  COOKIE_SECURE: "false"
  # OTP store. The Lua script is copied into the image at this path.
  REDIS_URL: redis://user-redis:6379
  REDIS_OTP_LUA: /app/scripts/atomic.lua
  OTP_HMAC_KEY_PATH: /app/keys/otp.key
  # OTP email through the SES API; credentials come from the service account's
  # IAM role (IRSA), so there is no SMTP password. The sender must be verified in SES.
  EMAIL_TRANSPORT: ses
  AWS_REGION: ap-southeast-1
  SMTP_FROM: "CampusDash <campusdash.otp@gmail.com>"
