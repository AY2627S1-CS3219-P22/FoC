# the service in this file sends traffic to user app pods, port 50051, 3001, used by other services calling user
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: foc
  labels: { app.kubernetes.io/name: user-service, app.kubernetes.io/part-of: foc }
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: user-service }
  template:
    metadata:
      labels: { app.kubernetes.io/name: user-service, app.kubernetes.io/part-of: foc }
    spec:
      # nodeSelector: { role: user }   # enable on EC2; leave off for local k3d
      imagePullSecrets:   # pulls image from GHCR and logs in
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000                  # the image's "node" user
      terminationGracePeriodSeconds: 30
      initContainers:   # applies any new database migrations, only relevant for user
        - name: migrate
          image: ghcr.io/ay2627s1-cs3219-p22/foc/user-service-migrate:sha-20d9c4f9614eb3dede74ec189a342d4039bea679
          imagePullPolicy: IfNotPresent
          command: ['npx', 'prisma', 'migrate', 'deploy']
          envFrom:
            - secretRef: { name: user-secrets }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
      containers:
        - name: user-service
          image: ghcr.io/ay2627s1-cs3219-p22/foc/user-service:sha-20d9c4f9614eb3dede74ec189a342d4039bea679 # same tag as migrate above
          imagePullPolicy: IfNotPresent
          ports:
            - { name: grpc, containerPort: 50051 }
            - { name: http, containerPort: 3001 }
          envFrom:  # loads settings and secrets from the other yaml files
            - configMapRef: { name: user-config }
            - secretRef: { name: user-secrets }
          volumeMounts:
            - name: user-public-key
              mountPath: /app/keys/public.pem
              subPath: public.pem
              readOnly: true
            - name: jwt-private-key
              mountPath: /app/keys/private.pem
              subPath: private.pem
              readOnly: true
            - name: logs
              mountPath: /repo/user-service/logs
          readinessProbe:  # calls /health every 10s and stops sending traffic to the pod if it keeps failing, for eg if database is down
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe: # checks that grpc port accepts connections and restarts container if it keeps failing
            tcpSocket: { port: grpc }
            initialDelaySeconds: 15
            periodSeconds: 20
          lifecycle:
            preStop:  # waits 5s before shutdown so traffic can move away, allows 30s in total
              sleep: { seconds: 5 }       # let traffic drain before SIGTERM
          resources:
            requests: { cpu: 250m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:  # bcs of this container logs need their own mount
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      volumes:
        - name: user-public-key
          configMap: { name: user-public-key }
        - name: jwt-private-key
          secret: { secretName: user-jwt-private-key }
        - name: logs
          emptyDir: {}
---  # how other pods reach the app
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: foc
  labels: { app.kubernetes.io/name: user-service, app.kubernetes.io/part-of: foc }
spec:
  clusterIP: None # headless: DNS returns every pod IP so gRPC clients can balance across pods
  selector: { app.kubernetes.io/name: user-service }
  ports:
    - { name: grpc, port: 50051, targetPort: grpc, appProtocol: grpc }
    - { name: http, port: 3001, targetPort: http }
