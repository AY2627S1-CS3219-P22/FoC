    function status(expected) {
      pm.test('HTTP ' + expected, () => pm.expect(pm.response.code).to.equal(expected));
      if (pm.response.code !== expected) throw new Error('Unexpected HTTP status; check setup before continuing');
    }
    const balanceShape = (actor, total, reserved) => ({
      userId: required(actor + 'Id'), totalCredits: total, reservedCredits: reserved, availableCredits: total - reserved,
    });
    function balance(actor, total, reserved) {
      pm.test(actor + ' balance: total ' + total + ', reserved ' + reserved, () =>
        pm.expect(pm.response.json()).to.deep.equal(balanceShape(actor, total, reserved)));
    }
    function historyShape(entries, actor) {
      pm.test(actor + ' public history fields and scope', () => {
