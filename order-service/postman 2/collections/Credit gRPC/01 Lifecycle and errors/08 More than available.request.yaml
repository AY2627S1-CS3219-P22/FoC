        orderId: raw.orderId ?? raw.order_id,
        requesterId: raw.requesterId ?? raw.requester_id,
        amount: raw.amount,
        status: typeof raw.status === 'number' ? ['RESERVATION_STATUS_UNSPECIFIED', 'RESERVED', 'RELEASED', 'SETTLED'][raw.status] : raw.status,
