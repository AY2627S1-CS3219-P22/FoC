syntax = "proto3";

package credit;

service CreditService {
  // Initialisation always uses user_id as its internal retry key.
  rpc InitCredits(InitCreditsRequest) returns (Balance);
  // Read current state; mutation replays may return historical receipts.
  rpc GetReservation(GetReservationRequest) returns (Reservation);
  rpc GetBalance(GetBalanceRequest) returns (Balance);
  rpc GetCreditHistory(GetCreditHistoryRequest) returns (CreditHistory);
  // Mutations commit balances, history, and retry results atomically.
  // Retry identities are internal: reserve/release/settle use order_id;
  // updates use (order_id, expected_version). Repeat the original request to retry.
  // Successful retries return the ORIGINAL response, even after later changes.
  // Conflicting parameters or invalid transitions fail with FAILED_PRECONDITION.
  rpc ReserveCredits(ReserveCreditsRequest) returns (Reservation);
  rpc UpdateReservation(UpdateReservationRequest) returns (Reservation);
  rpc ReleaseCredits(ReleaseCreditsRequest) returns (Reservation);
  rpc SettleCredits(SettleCreditsRequest) returns (Reservation);
  // Current reservation state and version for reconciliation; never a retry result.
  rpc GetReservation(GetReservationRequest) returns (Reservation);
}

message InitCreditsRequest {
  string user_id = 1;
  // Retired caller-supplied key; never reuse its field number or name.
  reserved 2;
  reserved "idempotency_key";
}

message GetBalanceRequest {
  string user_id = 1;
}

message Balance {
  string user_id = 1;
  int32 available_credits = 2;
  int32 reserved_credits = 3;
  int32 total_credits = 4;
}

message ReserveCreditsRequest {
  string order_id = 1;
  string requester_id = 2;
  // Positive whole credits. Insufficient available balance: FAILED_PRECONDITION.
  int32 amount = 3;
  reserved 4;
  reserved "idempotency_key";
}

message UpdateReservationRequest {
  string order_id = 1;
  int32 amount = 2;
  // Use the version returned by the previous reservation mutation.
  // Repeat the same version and amount on retry, even if the first response was lost.
  uint32 expected_version = 3;
  reserved 4;
  reserved "idempotency_key";
}

message ReleaseCreditsRequest {
  string order_id = 1;
  reserved 2;
  reserved "idempotency_key";
}

message SettleCreditsRequest {
  string order_id = 1;
  string courier_id = 2;
  reserved 3;
  reserved "idempotency_key";
}

message GetReservationRequest {
  string order_id = 1;
}

enum ReservationStatus {
  RESERVATION_STATUS_UNSPECIFIED = 0;
  RESERVED = 1;
  RELEASED = 2;
  SETTLED = 3;
}

message Reservation {
  string order_id = 1;
  string requester_id = 2;
  int32 amount = 3;
  ReservationStatus status = 4;
  // Empty until settlement.
  string courier_id = 5;
}
