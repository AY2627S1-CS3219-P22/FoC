# Run from inside supplier-service/:  docker compose up --build
#
# Ports are not published here because this file is included by the root Compose,
# where services communicate over the internal Docker network.
# compose.override.yaml publishes ports only for standalone development.
#
# supplier-db applies supabase/migrations then supabase/schemas/seed.sql on
# first start only, so use `docker compose down -v` to reseed from scratch.

services:
  supplier-db:
    image: public.ecr.aws/supabase/postgres:17.6.1.167
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - supplier_service_pgdata:/var/lib/postgresql/data
      # Run in filename order, after the image's own init-scripts/ which create
      # the postgres, anon, authenticated and service_role roles.
      - ./supabase/migrations/20260925071312_remote_schema.sql:/docker-entrypoint-initdb.d/z01_schema.sql:ro
      - ./supabase/migrations/20260925102600_add_ts_vector.sql:/docker-entrypoint-initdb.d/z02_fts.sql:ro
      - ./supabase/migrations/20260925102800_add_search_functions.sql:/docker-entrypoint-initdb.d/z03_search_functions.sql:ro
      - ./supabase/migrations/20260927173000_create_unique_index.sql:/docker-entrypoint-initdb.d/z04_unique_index.sql:ro
      - ./supabase/migrations/20260927190000_updated_at_ms_precision.sql:/docker-entrypoint-initdb.d/z05_updated_at_precision.sql:ro
      - ./supabase/migrations/20261004172304_create_supplier_opening_hours.sql:/docker-entrypoint-initdb.d/z06_opening_hours.sql:ro
      - ./supabase/migrations/20261006102848_location_search.sql:/docker-entrypoint-initdb.d/z07_location_search.sql:ro
      - ./supabase/schemas/seed.sql:/docker-entrypoint-initdb.d/z08_seed.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  supplier-service:
    # Context is the repo root so Docker can COPY shared/.
    build:
      context: ..
      dockerfile: supplier-service/Dockerfile
    restart: unless-stopped
    depends_on:
      supplier-db:
        condition: service_healthy
    # /health pings the DB
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3002/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      DATABASE_URL: 'postgresql://postgres:${POSTGRES_PASSWORD}@supplier-db:5432/${POSTGRES_DB}'
      PORT: '3002'
      GRPC_PORT: '50052'
      # Other services by service name (the code defaults to localhost).
      USER_GRPC_ADDR: user-service:50051
      ORDER_GRPC_ADDR: order-service:50053
      CREDIT_GRPC_ADDR: credit-service:50054
      USER_SERVICE_PUBLIC_KEY_PATH: /app/keys/public.pem
    volumes:
      # Fails at start if user-service's public key is missing
      # (run `npm run keys:generate` in user-service first).
      - type: bind
        source: ../user-service/keys/public.pem
        target: /app/keys/public.pem
        read_only: true
        bind:
          create_host_path: false
    networks: [internal]

# Private network for service-to-service traffic. Every service's compose file
# declares the same `internal`, the root compose merges them into one network.
networks:
  internal:

volumes:
  supplier_service_pgdata:
