# AI-assisted (Claude), reviewed and tested by Maliha
# Runs the UI container. Start the backend services first (each from its own
# compose file), then from the repo root:
#   docker compose -f ui/compose.yaml up -d --build
# and open http://localhost:8080
name: foc-ui

services:
  ui:
    build: .
    ports:
      - '127.0.0.1:${UI_PORT:-8080}:80'
    environment:
      # services publish their ports on the host, so reach them through it.
      # Once everything runs in one compose network these become service names,
      # e.g. http://user-service:3001
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://host.docker.internal:3001}
      SUPPLIER_SERVICE_URL: ${SUPPLIER_SERVICE_URL:-http://host.docker.internal:3002}
      ORDER_SERVICE_URL: ${ORDER_SERVICE_URL:-http://host.docker.internal:3003}
      CREDIT_SERVICE_URL: ${CREDIT_SERVICE_URL:-http://host.docker.internal:3004}
    extra_hosts:
      # makes host.docker.internal work on Linux too (Docker Desktop has it already)
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/health']
      interval: 10s
      timeout: 3s
      retries: 3