# Dev-only: publish ports to localhost when running user-service standalone.
# In the full stack, ports remain unpublished and services communicate via 
# the internal Docker network.
services:
  user-db:
    ports:
      - '5432:5432'

  user-service:
    ports:
      - '3001:3001'
      - '50051:50051'
    environment:
      # Standalone: the broker runs separately and publishes 5672 on the host.
      RABBITMQ_URL: amqp://guest:guest@host.docker.internal:5672
      # Standalone: order-service runs separately and publishes 50053 on the host.
      ORDER_GRPC_ADDR: host.docker.internal:50053
      # For EMAIL_TRANSPORT=ses: the AWS SDK uses this profile from the mounted
      # ~/.aws (run `aws sso login --profile foc` on the host first).
      AWS_PROFILE: ${AWS_PROFILE:-}
    volumes:
      - ${HOME}/.aws:/home/node/.aws:ro
